[project]
name = "brick-console"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "pybricksdev>=2.3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=12",
]

[project.scripts]
brick-console = "brick_console.run:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brick_console"]

[tool.hatch.build.targets.sdist]
include = ["src/brick_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "hub: needs the physical Pybricks hub over BLE; auto-skipped unless BRICK_CONSOLE_HUB_TESTS=1",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
# Fence: src only — tests stay unchecked for now (issue #31); --strict is a
# future decision. Bare `uv run mypy` must never widen this scope by accident.
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
# pybricksdev ships no stubs/py.typed; its surface is pinned by
# docs/research/pybricksdev-api-notes.md — the only module this leniency covers.
module = "pybricksdev.*"
ignore_missing_imports = true
