[project]
name = "brick-console"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "pybricksdev>=2.3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=12",
]

[project.scripts]
brick-console = "brick_console.run:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brick_console"]

[tool.hatch.build.targets.sdist]
include = ["src/brick_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "hub: needs the physical Pybricks hub over BLE; auto-skipped unless BRICK_CONSOLE_HUB_TESTS=1",
]

[tool.ruff]
target-version = "py312"
