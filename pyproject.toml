[project]
name = "brick-console"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "pybricksdev>=2.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "hub: needs the physical Pybricks hub over BLE; auto-skipped unless BRICK_CONSOLE_HUB_TESTS=1",
]

[tool.ruff]
target-version = "py312"